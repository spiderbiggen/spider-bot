name: Release

on:
  push:
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]

# Never cancel a release that is already running; queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.info.os }}
    timeout-minutes: 18
    outputs:
      executable: target/${{ matrix.info.target }}/release/spider-bot
    strategy:
      fail-fast: false
      matrix:
        info:
          - {
            os: "ubuntu-24.04",
            target: "x86_64-unknown-linux-musl",
          }
          - {
            os: "ubuntu-24.04-arm",
            target: "aarch64-unknown-linux-musl",
          }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Musl toolchain
        run: |
          sudo apt update
          sudo apt install -y musl-tools musl-dev

      - name: Set up Rust toolchain
        # Version and components come from rust-toolchain.toml
        run: |
          rustup toolchain install --profile minimal
          rustup target add ${{ matrix.info.target }}

      - name: Cargo Build
        run: cargo build --all-targets --target=${{ matrix.info.target }} --locked --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact ${{ matrix.info.target }}
          path: |
            target/*/release/spider-bot
            target/*/release/spider-bot.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3

      # Login against a Docker registry
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@ba754150c9dbbaa912ae0ac3cfba43f84195cef2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,priority=650
            type=ref,event=branch
          flavor: |
            latest=auto

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: target

      - name: Copy output files for Docker
        run: |
          mkdir -p exec/linux
          cp "target/artifact x86_64-unknown-linux-musl/x86_64-unknown-linux-musl/release/spider-bot" exec/linux/amd64
          cp "target/artifact aarch64-unknown-linux-musl/aarch64-unknown-linux-musl/release/spider-bot" exec/linux/arm64

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@ef1fb9688fc3626d0fd5e462f502cbbdc6456feb
        with:
          context: .
          push: true
          provenance: false # Disable provenance to avoid unknown/unknown
          sbom: false       # Disable sbom to avoid unknown/unknown
          file: ./CI.Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  changelog:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update CHANGELOG
        id: changelog
        uses: requarks/changelog-action@7ce6be4c4d2233ae2a943694ca34f23aeafa1054 # v1.11.0
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}

  deploy:
    needs: publish
    # Skip pre-releases (v1.2.3-rc.1); `latest` is only moved for stable tags.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Trigger Portainer redeploy
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: curl --fail --silent --show-error --retry 3 --max-time 60 -X POST "$PORTAINER_WEBHOOK_URL"
